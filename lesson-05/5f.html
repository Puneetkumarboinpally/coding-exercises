<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        p{
            font-family: arial;
            margin-top: 0px;
            margin-bottom: 0px;
        }
        .price{
            font-size: 26px;
            margin-bottom: 8px;

        }
        .con{
            color:rgb(96,96,96);
            font-size: 14px;
        }
        .stk{
            color:green;
            margin-bottom: 8px;

        }
        .hour{
            color: rgb(96,96,96);
            font-size:14px;
        }
        .stk2{
            color:red;
        }
    </style>
    
</head>
<body>
    <p class="price">
        1,049.61 <span class="con">
            USD
        </span>
    </p>
    <p class="stk">
        +18.05 (1.75%) today
    </p>
    <p class="hour">
        After hours 1,048.00
        <span class="stk2">
            -1.61 (0.15%)
        </span>

    </p>
    
</body>
</html>
