<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        p{
            font-family: arial;
            margin-top: 0px;
            margin-bottom: 0px;
            text-align: center;
        }
        .new_btn{
            color:red;
            margin-bottom: 8px;
            font-size: 10px;

        }
        .item{
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .desc{
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .price{
            color:rgb(96,96,96);
            margin-bottom: 25px;

        }
        .buy{
            background-color: rgb(58, 108, 199);
            color:white;
            border:none;
            border-radius: 30px;
            padding-top: 7px;
            padding-bottom: 7px;
            padding-left: 14px;
            padding-right: 14px;
            font-family: arial;
            cursor: pointer;     
        }

    </style>
</head>
<body>
    <p class="new_btn">
        New
    </p>
    <p class="item">
        MacBook Pro
    </p>
    <p class="desc">
        Supercharged for pros.
    </p>
    <p class="price">
        From &#36;1999
    </p>
    <p>
    <span class="buy">
        Buy
    </span>
</p>

</body>
</html>
