<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .amazon_btn{
            color:rgb(0,113,133)
        }
        .title{
            font-size: 24px;
            font-weight: bold;
        }
        .price{
            color:rgb(0,118,0);
            font-weight: bold;
        }
        .cart_btn{
            background-color: rgb(255,216,20);
            border:none;
            height:40px;
            width: 150px;
            border-radius: 20px;
            cursor:pointer;
            margin-right: 8px;
        }
        .buy_btn{
            background-color: rgb(255,164,28);
            border:none;
            height:40px;
            width: 150px;
            border-radius: 20px;
            cursor:pointer;
        }

    </style>
</head>
<body>
    <a href="https://www.amazon.co.uk/" target="_blank" class="amazon_btn">
        Back to Amazon
    </a>
    <p class="title">Nike Black Running Shoes</p>
    <p class="price">$39-in stock.</p>
    <p class="p3">Free delivery tomorrow.</p>
    <button class="cart_btn">Add to Cart</button>
    <button class="buy_btn">Buy Now</button>
</body>
</html>
