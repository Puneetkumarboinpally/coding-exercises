<!DOCTYPE html>
<html lang="en">
<head>
   <style>
    .started_btn{
        background-color: rgb(121,82,179);
        color: white;
        border:none;
        height: 40px;
        width: 110px;
        border-radius: 4px;
        font-weight: bold;
        cursor:pointer;
        margin-right: 6px;
    }
    .Download_btn{
        background-color:white;
        color: rgb(108,117,125);
        height: 40px;
        width: 100px;
        border-color:rgb(108,117,125);
        border-radius: 4px;
        font-weight: bold;
        border-width: 1px;
        border-style: solid;
        cursor: pointer;
    }

   </style>
</head>
<body>
    <button class="started_btn">Get Started</button>
    <button class="Download_btn">Download</button>
</body>
</html>
