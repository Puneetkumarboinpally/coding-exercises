<!DOCTYPE html>
<html lang="en">
<head>
   <style>
    button{
        background-color: rgb(46, 164,79);
        border:none;
        color:white;
        height:36px;
        width: 95px;
        border-radius:5px;
        font-weight: bold;
        cursor: pointer;
        transition: box-shadow 0.15s;
    }
    button:hover{
        box-shadow: 4px 4px 10px rgba(0,0,0,0.3);
    }
   </style>
</head>
<body>
    <button>Sign up</button>
</body>
</html>
