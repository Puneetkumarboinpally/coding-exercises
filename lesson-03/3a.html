<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        button{
            background-color: black;
            color: white;
            height: 40px;
            width: 105px;
            border-radius: 3px;
            border:none;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        button:hover {
            opacity: 0.8;
        }
        button:active {
            opacity: 0.4;
        }
    </style>
</head>
<body>
    <button>Request now</button>  
</body>
</html>
