<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .Apply_btn{
            background-color: rgb(10,102,194);
            color:white;
            border: none;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 20px;
            padding-right: 20px;
            border-radius: 20px;
            font-weight: bold;
            margin-right: 8px;
            cursor:pointer;
            transition: background-color 0.15s;
        }
        .Apply_btn:hover{
            background-color: rgb(6, 72, 138);
        }
        .save_btn{
            background-color: white;
            color:rgb(10,102,194);
            border-color: rgb(10,102,194);
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 20px;
            padding-right: 20px;
            border-radius: 20px;
            border-width: 1.5px;
            font-weight:bold;
            cursor: pointer;
            border-style: solid;
            font: size 15px;
            transition:  background-color 0.15s,
            border-width 0.15s;
        }
        .save_btn:hover{
            background-color: rgb(226, 240, 254);
            border-width: 2px;
        }
    </style>
</head>
<body>
    <button class="Apply_btn">
        Apply on company website
    </button>
    <button class="save_btn">
       Save
    </button>
    
</body>
</html>
