<!DOCTYPE html>
<html lang="en">
<head>
    <title>Shadow</title>
    <style>
        button{
            background-color: green;
            color:white;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-right: 20px;
            padding-left: 20px;
            font-size: 18px;
            border: none;
            cursor:pointer;
            box-shadow: 3px 3px 5px rgba(0,0,0,0.3);
        }
        button:active{
            margin-left: 3px;
            margin-top: 3px;
            box-shadow:none;
           
        }

    </style>
</head>
<body>
    <button>Shadow</button>
    
</body>
</html>
