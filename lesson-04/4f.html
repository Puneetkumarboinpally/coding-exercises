<!DOCTYPE html>
<html lang="en">
<head>
   <style>
    button{
        background-color: rgb(29, 161, 242);
        color:white;
        border:none;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-right: 20px;
        padding-left: 20px;
        border-radius: 20px;
        font-weight: bold;
        cursor:pointer;
        transition: background-color 0.15s,
        box-shadow 0.15s;
    }
    button:hover{
        background-color: rgb(6, 85, 134);
        
    }
    button:active{
        box-shadow: 5px 8px 10px rgba(0,0,0,0.3);
        
    }
   </style>
</head>
<body>
    <button>Tweet</button>
</body>
</html>
