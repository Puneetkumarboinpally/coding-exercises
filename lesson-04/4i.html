<!DOCTYPE html>
<html lang="en">
<head>
    <title>Stretch</title>
    <style>
        button{
            background-color: green;
            color: white;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 20px;
            padding-right: 20px;
            cursor: pointer;
            font-size: 16px;
            border:none;
            transition: font-size 1s, 
            padding-right 1s,
            padding-bottom 1s,
            padding-top 1s, 
            padding-left 1s;
        }
        button:hover{
            font-size: 20px;
            padding-top:30px;
            padding-right: 50px;
            padding-bottom: 30px;
            padding-left: 50px;
        }

    </style>
</head>
<body>
    <button>
        Stretch
    </button>
    
</body>
</html>
