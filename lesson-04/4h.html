<!DOCTYPE html>
<html lang="en">
<head>
    <title>Pagination</title>
    <style>
        .back_btn{
            background-color: white;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 20px;
            padding-right: 20px;
            border-radius: 2px;
            border-width:1px;
            border-style: solid;
            cursor: pointer;
            margin-left: 8px;
            margin-right: 8px;
            font-size: 16px;
        }
        .one_btn{
            margin-left:8px;
            font-size: 18px;
            margin-right: 8px;
        }

    </style>
</head>
<body>
    <button class="back_btn">Back</button>
    <a href="#" class="one_btn">1</a>
    <a href="#" class="one_btn">2</a>
    <a href="#" class="one_btn">3</a>
    <a href="#" class="one_btn">4</a>
    <a href="#" class="one_btn">5</a>
    <button class="back_btn">Next</button>
    
</body>
</html>
