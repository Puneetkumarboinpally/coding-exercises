<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        button{
            background-color: green;
            color:white;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 20px;
            padding-right: 20px;
            border:none;
            font-size: 18px;
            cursor: pointer;
            margin-left: 20px;
            margin-right: 20px;
            transition: padding 0.5s,margin 0.5s;
        }
        button:hover{
            padding-left: 40px;
    padding-right: 40px;
    margin-left: 0px;
    margin-right: 0px;
        }
       

    </style>
</head>
<body>
    <button> One</button>
    <button> Two</button>
    <button> Three</button>
    

</body>
</html>
